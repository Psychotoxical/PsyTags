name: CI

# Pull requests and pushes to main run only what the change needs: Lint always, the tests on
# all systems when code changes, the packages when a pull request changes the packaging.
# `ci-ok` sums up the run; it is the one check main requires. Releases are built by the
# channel workflows (main → next, next → release), started by hand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Was hat sich geändert?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      packaging: ${{ steps.files.outputs.packaging }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                files=ALL
              else
                files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
              fi ;;
            *)
              files=ALL ;;
          esac
          printf '%s\n' "$files"
          code=false
          packaging=false
          if [ "$files" = ALL ] || grep -qE '^(psytags/|tests/|pyproject\.toml$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            code=true
          fi
          # packages only for pull requests: main gets its packages through the channels
          if [ "$EVENT" = pull_request ] && grep -qE '^(packaging/|\.github/workflows/)' <<< "$files"; then
            packaging=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"
          echo "::notice::Tests: $code, Pakete: $packaging"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - name: Ruff
        run: ruff check --output-format github .
      - name: ShellCheck
        run: shellcheck packaging/*.sh
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  tests:
    name: Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliotheken für Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests

  packages:
    name: Pakete
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/packages.yml
    secrets: inherit

  ci-ok:
    name: ci-ok
    needs: [changes, lint, tests, packages]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Not green: $bad"
            exit 1
          fi
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success
