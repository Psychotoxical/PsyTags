name: CI

# Every pull request needs an entry under [Unreleased] in CHANGELOG.md.
# Pull requests and pushes to main run on Linux only, like Psysonic: Lint always, the tests when
# code changes. The macOS and Windows runners are kept for the releases: the channel workflows
# build all packages and run the tests of those systems there (packages.yml); a package can be
# built by hand at any time (Actions → Pakete → Run workflow).
# `ci-ok` sums up the run; it is the one check main requires. Releases are built by the
# channel workflows (main → next, next → release), started by hand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Was hat sich geändert?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                files=ALL
              else
                files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
              fi ;;
            *)
              files=ALL ;;
          esac
          printf '%s\n' "$files"
          code=false
          if [ "$files" = ALL ] || grep -qE '^(psytags/|tests/|pyproject\.toml$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::Tests: $code"

  changelog:
    name: Changelog-Eintrag
    # every pull request needs an entry under [Unreleased]; it becomes the next version's
    # section. Bots (Dependabot, the release sync) are exempt.
    if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:CHANGELOG.md" > "$RUNNER_TEMP/base.md" 2>/dev/null || : > "$RUNNER_TEMP/base.md"
          python3 packaging/check_changelog.py "$RUNNER_TEMP/base.md" CHANGELOG.md

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - name: Ruff
        run: ruff check --output-format github .
      - name: ShellCheck
        run: shellcheck packaging/*.sh
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  tests:
    name: Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliotheken für Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests

  ci-ok:
    name: ci-ok
    needs: [changes, changelog, lint, tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Not green: $bad"
            exit 1
          fi
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success
