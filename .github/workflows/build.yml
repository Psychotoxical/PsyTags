name: Pakete bauen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotheken für Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests

  ffmpeg:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update && sudo apt-get install -y nasm mingw-w64
      - run: packaging/build_ffmpeg.sh ${{ matrix.target }} ffmpeg-out
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out

  windows:
    needs: [tests, ffmpeg]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg
      - run: pip install . pyinstaller
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests
      - name: Paket
        env:
          PSYTAGS_FFMPEG: ${{ github.workspace }}\ffmpeg\bin\ffmpeg.exe
        run: python -m PyInstaller --noconfirm --clean packaging/psytags.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PsyTags-Windows
          path: dist/PsyTags

  appimage:
    needs: [tests, ffmpeg]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotheken für Qt
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux
          path: ffmpeg
      - run: chmod +x ffmpeg/bin/ffmpeg
      - run: pip install . pyinstaller
      - name: Paket
        env:
          PSYTAGS_FFMPEG: ${{ github.workspace }}/ffmpeg/bin/ffmpeg
        run: python -m PyInstaller --noconfirm --clean packaging/psytags.spec
      - run: packaging/build_appimage.sh
      - name: Startet das Paket?
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          status=0
          timeout 15 dist/PsyTags-x86_64.AppImage || status=$?
          test "$status" = 124
      - uses: actions/upload-artifact@v4
        with:
          name: PsyTags-Linux-AppImage
          path: dist/PsyTags-x86_64.AppImage
