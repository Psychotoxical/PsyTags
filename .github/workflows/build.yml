name: CI und Pakete

# Every pull request and every push to main runs the checks and builds all packages.
# On main, a version without a published release gets a release draft with these packages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - name: Ruff
        run: ruff check --output-format github .
      - name: ShellCheck
        run: shellcheck packaging/*.sh
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliotheken für Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests

  ffmpeg:
    name: ffmpeg (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: linux, script: linux, runner: ubuntu-22.04 }
          - { target: windows, script: windows, runner: ubuntu-22.04 }
          - { target: macos-x86_64, script: macos, runner: macos-15-intel }
          - { target: macos-arm64, script: macos, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Werkzeuge
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm mingw-w64
      - name: Werkzeuge (Mac mit Intel)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS' && runner.arch == 'X64'
        run: brew install nasm
      - if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/build_ffmpeg.sh ${{ matrix.script }} ffmpeg-out
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out

  windows:
    needs: [lint, tests, ffmpeg]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows
          path: ffmpeg
      - run: pip install . pyinstaller
      - name: Paket
        env:
          PSYTAGS_FFMPEG: ${{ github.workspace }}\ffmpeg\bin\ffmpeg.exe
        run: python -m PyInstaller --noconfirm --clean packaging/psytags.spec
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $path = if ($iscc.Source) { $iscc.Source } else { $iscc.FullName }
          $version = python -c "import psytags; print(psytags.__version__)"
          & $path -Q "/DAppVersion=$version" packaging/psytags.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installer installiert und entfernt sich
        shell: pwsh
        run: |
          $setup = Get-Item dist/PsyTags-Setup-*.exe
          $dir = "$env:RUNNER_TEMP\psytags-test"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/TASKS=","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode) { throw "Installation: $($p.ExitCode)" }
          if (-not (Test-Path "$dir\PsyTags.exe")) { throw "PsyTags.exe fehlt" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode) { throw "Deinstallation: $($u.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: PsyTags-Windows-Setup
          path: dist/PsyTags-Setup-*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: PsyTags-Windows
          path: dist/PsyTags

  linux:
    needs: [lint, tests, ffmpeg]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliotheken für Qt
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-linux
          path: ffmpeg
      - run: chmod +x ffmpeg/bin/ffmpeg
      - run: pip install . pyinstaller
      - name: Paket
        env:
          PSYTAGS_FFMPEG: ${{ github.workspace }}/ffmpeg/bin/ffmpeg
        run: python -m PyInstaller --noconfirm --clean packaging/psytags.spec
      - run: packaging/build_appimage.sh
      - name: Startet das AppImage?
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          status=0
          timeout 15 dist/PsyTags-x86_64.AppImage || status=$?
          test "$status" = 124
      - name: deb und rpm
        run: packaging/build_linux_packages.sh
      - uses: actions/upload-artifact@v7
        with:
          name: PsyTags-Linux-AppImage
          path: dist/PsyTags-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: PsyTags-Linux-deb
          path: dist/psytags_*_amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: PsyTags-Linux-rpm
          path: dist/psytags-*.x86_64.rpm

  macos:
    name: macOS (${{ matrix.arch }})
    needs: [lint, tests, ffmpeg]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: macos-15-intel }
          - { arch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: ffmpeg
      - run: chmod +x ffmpeg/bin/ffmpeg
      - run: pip install . pyinstaller pillow
      - name: Paket
        env:
          PSYTAGS_FFMPEG: ${{ github.workspace }}/ffmpeg/bin/ffmpeg
        run: python -m PyInstaller --noconfirm --clean packaging/psytags.spec
      # Signing needs the Apple secrets; pull requests from forks have none and stay unsigned.
      - name: Signieren
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No signing secrets: the app stays unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$keychain" $existing
          packaging/sign_macos.sh dist/PsyTags.app "$APPLE_SIGNING_IDENTITY"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Startet PsyTags.app, läuft ffmpeg darin?
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=dist/PsyTags.app
          test "$(lipo -archs "$app/Contents/MacOS/PsyTags")" = "${{ matrix.arch }}"
          "$app/Contents/Frameworks/ffmpeg/ffmpeg" -hide_banner -version | head -1
          "$app/Contents/MacOS/PsyTags" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"
      - name: DMG
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' psytags/__init__.py)
          mkdir dmg
          cp -R dist/PsyTags.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname PsyTags -srcfolder dmg -fs HFS+ -format UDZO \
            "dist/PsyTags-$version-macOS-${{ matrix.arch }}.dmg"
      - name: Notarisieren
        if: steps.sign.outputs.signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          dmgs=(dist/PsyTags-*-macOS-*.dmg)
          dmg=${dmgs[0]}
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json > notary.json
          rm "$key"
          cat notary.json
          test "$(python3 -c 'import json; print(json.load(open("notary.json"))["status"])')" = Accepted
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$dmg" > /dev/null
          spctl --assess --type exec --verbose=2 "$RUNNER_TEMP/mnt/PsyTags.app"
          hdiutil detach "$RUNNER_TEMP/mnt" > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: PsyTags-macOS-${{ matrix.arch }}
          path: dist/PsyTags-*-macOS-*.dmg

  deb:
    name: deb installiert sich (Ubuntu 24.04)
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PsyTags-Linux-deb
      - run: sudo apt-get update && sudo apt-get install -y ./psytags_*_amd64.deb
      - name: Startet PsyTags?
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          status=0
          timeout 15 psytags || status=$?
          test "$status" = 124
      - run: sudo apt-get remove -y psytags && test ! -e /usr/bin/psytags

  rpm:
    name: rpm installiert sich (Fedora)
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PsyTags-Linux-rpm
      - run: dnf install -y ./psytags-*.x86_64.rpm
      - name: Startet PsyTags?
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          status=0
          timeout 15 psytags || status=$?
          test "$status" = 124
      - run: dnf remove -y psytags && test ! -e /usr/bin/psytags

  release:
    name: Release-Draft
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, linux, deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: PsyTags-*
          path: assets
          merge-multiple: true
      - name: Draft anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' psytags/__init__.py)
          tag="v$version"
          python3 packaging/release_notes.py "$version" > notes.md
          files=(assets/PsyTags-Setup-"$version".exe assets/PsyTags-x86_64.AppImage
                 assets/psytags_"$version"_amd64.deb assets/psytags-"$version"-1.x86_64.rpm)
          ls -l "${files[@]}"
          state=$(gh release list --limit 100 --json tagName,isDraft \
                  --jq ".[] | select(.tagName == \"$tag\") | if .isDraft then \"draft\" else \"published\" end")
          case "$state" in
            published)
              echo "::notice::$tag is already published; nothing to do"
              ;;
            draft)
              gh release edit "$tag" --title "PsyTags $version" --notes-file notes.md --target "$GITHUB_SHA"
              gh release upload "$tag" "${files[@]}" --clobber
              echo "::notice::Draft $tag updated"
              ;;
            *)
              gh release create "$tag" --draft --title "PsyTags $version" --notes-file notes.md \
                --target "$GITHUB_SHA" "${files[@]}"
              echo "::notice::Draft $tag created"
              ;;
          esac
